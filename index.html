<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청소당번 뽑기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>청소당번 추첨기</h1>
            <p>1번부터 30번 중에서 5명을 랜덤으로 선정합니다.</p>
        </header>
        
        <main>
            <div class="slot-machine-container">
                <div id="result-display" class="result-display">
                    <div class="number-slot" id="slot-1">?</div>
                    <div class="number-slot" id="slot-2">?</div>
                    <div class="number-slot" id="slot-3">?</div>
                    <div class="number-slot" id="slot-4">?</div>
                    <div class="number-slot" id="slot-5">?</div>
                </div>
            </div>
            
            <button id="draw-btn" class="draw-btn">추첨 시작!</button>
        </main>
        
        <div id="confetti-container"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
